name: Fetch Exchange Rates

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch rates and push
        run: node fetch-rates.js
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
